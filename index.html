<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevTools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <header>

    <div class="header-content">

        <div>
            <h1>DevTools</h1>
            <p>Central de Comandos para TI</p>
        </div>

        <button id="themeToggle" class="theme-toggle">
            🌙
        </button>

    </div>

</header>
    </header>

    <main class="container">

        <!-- DASHBOARD -->

        <div class="dashboard">

            <div class="stat-card">
                <h3>Comandos</h3>
                <strong id="totalCommands">0</strong>
            </div>

            <div class="stat-card">
                <h3>Categorias</h3>
                <strong id="totalCategories">0</strong>
            </div>

            <div class="stat-card">
                <h3>Favoritos</h3>
                <strong id="totalFavorites">0</strong>
            </div>

        </div>


        <!-- PESQUISA -->

        <input
            type="text"
            class="search"
            placeholder="🔎 Pesquise um comando..."
        >


        <!-- CATEGORIAS -->

        <div class="categories">

            <button class="category active" data-category="todos">
                Todos
            </button>

            <button class="category" data-category="git">
                Git
            </button>

            <button class="category" data-category="linux">
                Linux
            </button>

            <button class="category" data-category="python">
                Python
            </button>

            <button class="category" data-category="sql">
                SQL
            </button>

            <button class="category" data-category="favoritos">
                ⭐ Favoritos
            </button>

        </div>


        <!-- COMANDOS -->

        <div class="commands">


         <!-- COMANDOS -->

<div class="commands" id="commandsContainer">

</div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
